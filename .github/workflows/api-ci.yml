name: Backend API CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - "apps/api/**"
      - "packages/shared-types/**"
      - "packages/tsconfig/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: [main, master, develop]
    paths:
      - "apps/api/**"
      - "packages/shared-types/**"
      - "packages/tsconfig/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".github/workflows/api-ci.yml"

jobs:
  build-and-test:
    name: Build & Verify API Gateway
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @vetralink/api db:generate

      - name: Build Shared Types
        run: pnpm --filter @vetralink/shared-types build

      - name: Build API Application
        run: pnpm --filter @vetralink/api build
