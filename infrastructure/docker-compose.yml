services:
  postgres:
    image: postgres:16-alpine
    container_name: vetralink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vetralink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vetralink_secret_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-vetralink_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vetralink} -d ${POSTGRES_DB:-vetralink_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vetralink-network

  redis:
    image: redis:7-alpine
    container_name: vetralink-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_secret_dev_pass}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret_dev_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vetralink-network

  minio:
    image: minio/minio:RELEASE.2024-08-29T01-40-52Z
    container_name: vetralink-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vetralink_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_dev_pass}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vetralink-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  vetralink-network:
    driver: bridge
